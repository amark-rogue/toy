<script src="../gun/kit/web.js"></script>

<form id="form" action="./http/one.html" method="post" target="one">
  <input name="word" value="form">
  <input name="tag" value="one"><input name="tag" value="two">
  <button>send</button>
</form>
<iframe id="one" name="one" src="./http/one.html"></iframe>
<iframe id="call" name="call" src="./http/call.html"></iframe>
<iframe id="late" name="late" src="./http/late.html"></iframe>
<iframe id="move" name="move" src="./http/one.html"></iframe>
<iframe id="empty"></iframe>
<iframe id="plain" src="./http/plain.html"></iframe>
<iframe name="twice" src="./http/one.html"></iframe>
<iframe name="twice" src="./http/one.html"></iframe>
<pre id="result">WAIT</pre>

<script>
;(function(TEST){
TEST.ok = function(got, want, note){
  if(got !== want){ throw new Error(note + ': got ' + got + ', want ' + want) }
};
TEST.early = kit.fetch(document.getElementById('late'), {word:'early'});
TEST.wait = function(fn){
  return new Promise(function(ok, no, end){
    end = performance.now() + 2000;
    (function poll(){ if(fn()){ ok(); return } if(performance.now() > end){ no(new Error('component update timed out')); return } setTimeout(poll, 10) }());
  });
};

TEST.run = async function(){
  var body, both, view = document.getElementById('one');
  var call = document.getElementById('call');
  var late = document.getElementById('late');
  var form = document.getElementById('form');
  var result = document.getElementById('result');
  TEST.step = 'direct iframe';
  body = await kit.fetch(view, {word:'first'});
  TEST.ok(body.count, 1, 'direct iframe request');
  TEST.ok(body.word, 'first', 'target hydrates itself without parent DOM access');
  TEST.ok(body.url, new URL('./http/one.html', location.href).href, 'component receives its URL');

  TEST.step = 'named target';
  TEST.at = performance.now();
  body = await kit.fetch('./http/one.html', {word:'second'}, 'one');
  TEST.ms = performance.now() - TEST.at;
  TEST.ok(body.count, 2, 'named target stays in place');
  if(500 <= TEST.ms){ throw new Error('reused target took ' + TEST.ms + 'ms') }

  TEST.step = 'nested target';
  body = await kit.fetch(call, {
    url:new URL('./http/one.html', location.href).href,
    target:'one',
    body:{word:'uncle'}
  });
  TEST.ok(body.count, 3, 'nested caller reaches nearest uncle target');
  TEST.ok(body.word, 'uncle', 'uncle receives nested body');

  TEST.step = 'request before server declaration';
  body = await TEST.early;
  TEST.ok(body.word, 'early', 'a request arriving while the component parses waits for its server');

  TEST.step = 'nested parent';
  body = await kit.fetch(late, {word:'late'});
  TEST.ok(body.word, 'late', 'a late parent module discovers its existing child server');

  TEST.step = 'form submit';
  form.onsubmit = function(){
    this.querySelector('input').value += '!';
  };
  form.requestSubmit();
  await TEST.wait(function(){ return 'form!' === view.contentDocument.getElementById('word').textContent });
  body = await kit.fetch(view, {word:'after form'});
  TEST.ok(body.count, 5, 'custom submit sends once');
  TEST.ok(body.last.word, 'form!', 'custom submit sees edited form data');
  TEST.ok(body.last.tag.join(','), 'one,two', 'repeated form fields stay repeated');

  TEST.step = 'response status';
  try{
    await kit.fetch(view, {word:'teapot', status:418});
    throw new Error('response status did not reject');
  }catch(err){
    if('response status did not reject' === err.message){ throw err }
    TEST.ok(err.status, 418, 'res.status crosses the component boundary');
    TEST.ok(err.body.word, 'teapot', 'res.end body is retained on an error');
  }

  TEST.step = 'targetless request';
  body = await kit.fetch('./http/one.html', {word:'pool'});
  TEST.ok(body.count, 1, 'targetless request uses a programmatic component');
  TEST.ok(body.word, 'pool', 'targetless response is returned');

  TEST.step = 'pooled request';
  body = await kit.fetch('./http/one.html', {word:'again'});
  TEST.ok(body.count, 2, 'programmatic component is preloaded and reused');

  TEST.step = 'target navigation';
  body = await kit.fetch('./http/one.html?move', {word:'move'}, 'move');
  TEST.ok(body.count, 1, 'navigated target waits for its exact new server');
  TEST.ok(body.word, 'move', 'navigated target receives its pending request');

  TEST.step = 'concurrent target navigation';
  both = await Promise.all([
    kit.fetch('./http/one.html?first', {word:'first move', wait:30}, 'move'),
    kit.fetch('./http/one.html?second', {word:'second move'}, 'move'),
    kit.fetch('./http/one.html?first', {word:'last move'}, 'move')
  ]);
  body = both;
  TEST.ok(body[0].word, 'first move', 'first navigation reaches its own document');
  TEST.ok(body[1].word, 'second move', 'second navigation waits instead of stealing the first request');
  TEST.ok(body[2].count, 1, 'third navigation waits behind the different document instead of skipping ahead');
  TEST.ok(body[2].word, 'last move', 'A-B-A navigation preserves request order');

  TEST.step = 'empty iframe';
  try{
    await kit.fetch(document.getElementById('empty'), {word:'bad'});
    throw new Error('empty iframe request did not reject');
  }catch(err){
    if('empty iframe request did not reject' === err.message){ throw err }
    TEST.ok(err.message, 'Kit iframe needs a URL', 'empty iframe never loads the caller recursively');
  }

  TEST.step = 'component without server';
  try{
    await kit.fetch(document.getElementById('plain'), {word:'none'});
    throw new Error('component without server did not reject');
  }catch(err){
    if('component without server did not reject' === err.message){ throw err }
    TEST.ok(err.status, 501, 'an event-only component declines finite requests promptly');
  }

  TEST.step = 'duplicate target';
  try{
    await kit.fetch('./http/one.html', {word:'bad'}, 'twice');
    throw new Error('duplicate target did not reject');
  }catch(err){
    if('duplicate target did not reject' === err.message){ throw err }
    TEST.ok(err.status, 409, 'duplicate target names fail instead of guessing');
  }

  TEST.step = 'cross-origin URL';
  try{
    await kit.fetch('https://example.com/', {});
    throw new Error('cross-origin request did not reject');
  }catch(err){
    if('cross-origin request did not reject' === err.message){ throw err }
    TEST.ok(err.message, 'Kit URL must be local', 'component URLs cannot escape their origin');
  }

  TEST.step = 'URL page frame';
  location.path = './http/plain.html';
  view = document.getElementById('http/plain.html');
  TEST.ok(!!view, true, 'location.path opens a component directly');
  TEST.ok(view.getAttribute('src'), 'http/plain.html', 'location.path keeps the requested URL');

  result.textContent = 'PASS Kit component requests, scoped targets, forms, and replies (' + Math.ceil(TEST.ms) + 'ms reused)';
};

window.addEventListener('load', function(){
  TEST.run().catch(function(err){ result.textContent = 'FAIL ' + TEST.step + '\n' + (err.stack || err) });
});
}(window.TEST = {}));
</script>
