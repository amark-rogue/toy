<script src="../gun/kit/web.js"></script>
<pre id="result">WAIT</pre>
<script>
;(function(TEST){
TEST.data = {
  cat:'bash-3.2$ cat note.txt\r\nhello\r\n',
  cd:'bash-3.2$ cd /tmp\r\n',
  cp:'bash-3.2$ cp one two\r\n',
  echo:'bash-3.2$ echo hello\r\nhello\r\n',
  git:"bash-3.2$ git status\r\nOn branch main\r\nYour branch is up to date with 'origin/main'.\r\n\r\nnothing to commit, working tree clean\r\n",
  grep:'bash-3.2$ grep hello note.txt\r\nnote.txt:hello\r\n',
  ls:'bash-3.2$ ls .\r\none.txt\ttwo\r\n',
  mkdir:'bash-3.2$ mkdir new\r\n',
  mv:'bash-3.2$ mv one two\r\n',
  npm:'bash-3.2$ npm test\r\npassed\r\n',
  open:'bash-3.2$ open note.html\r\n',
  ping:'bash-3.2$ ping host\r\n64 bytes\r\n',
  ps:'bash-3.2$ ps\r\nPID TTY TIME CMD\r\n1 t 0 sh\r\n',
  pwd:'bash-3.2$ pwd\r\n/tmp\r\n',
  rm:'bash-3.2$ rm old\r\n',
  tail:'bash-3.2$ tail note.txt\r\nlast\r\n',
  touch:'bash-3.2$ touch new\r\n',
  whoami:'bash-3.2$ whoami\r\nmars\r\n'
};
TEST.git = function(all, i, doc, view, text){
  all = document.querySelectorAll('iframe');
  for(i = 0; i < all.length; i += 1){
    if(!/\/cmd\/git\.html(?:[?#]|$)/.test(all[i].src)){ continue }
    doc = all[i].contentDocument;
    view = doc && doc.querySelector('#app > iframe');
    doc = view && view.contentDocument;
    view = doc && doc.querySelector('[name="body"]');
    text = view && view.textContent.replace(/\s+/g, ' ').trim();
    TEST.seen = text || TEST.seen;
    if(view && !view.hidden && 'Branch main is up to date with origin/main.' === text){ return true }
  }
};
TEST.wait = async function(fn, i){
  for(i = 0; i < 100; i += 1){
    if(fn()){ return }
    await new Promise(function(ok){ setTimeout(ok, 20) });
  }
  throw Error('git status rendered ' + (TEST.seen || 'nothing'));
};
TEST.run = async function(){
  var name, count = 0, pick = new URLSearchParams(location.search).get('cmd'), start = performance.now();
  for(name in TEST.data){
    if(pick && pick !== name){ continue }
    TEST.now = name; count += 1;
    await kit.fetch('../cmd/' + name + '.html', TEST.data[name]);
    await new Promise(function(ok){ setTimeout(ok, 50) });
  }
  if(!pick || 'git' === pick){ TEST.now = 'git view'; await TEST.wait(TEST.git) }
  result.textContent = 'PASS ' + count + ' finite command components (' + Math.ceil(performance.now() - start) + 'ms)';
};
window.addEventListener('load', function(){ TEST.run().catch(function(err){ result.textContent = 'FAIL ' + TEST.now + '\n' + (err.stack || err) }) });
}(window.TEST = {}));
</script>
