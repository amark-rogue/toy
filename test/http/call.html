<script src="../../gun/kit/web.js"></script>
<script>
;(function(call){
call.serve = async function(req, res){
  var body = req.body || {};
  var reply = await kit.http.post(body.url, body.body, {target:body.target});
  res.writeHead(reply.status, {'content-type':'application/json'});
  res.end(await reply.json());
};
kit.http.createServer(call.serve).listen();
}(window.call = {}));
</script>
