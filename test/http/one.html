<script src="../../gun/kit/web.js"></script>
<output id="word"></output>
<script>
;(function(one){
one.count = 0;
one.serve = function(req, res){
  var body = req.body || {}, data;
  one.count += 1;
  word.textContent = body.word || '';
  data = {count:one.count, word:word.textContent, tag:body.tag, url:req.url, last:one.last};
  one.last = {word:word.textContent, tag:body.tag};
  if(body.status){ res.status = body.status; res.end(data); return }
  if(body.wait){ return new Promise(function(ok){ setTimeout(function(){ ok(data) }, body.wait) }) }
  res.end(data);
};
kit.createServer(one.serve);
}(window.one = {}));
</script>
