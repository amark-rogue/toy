<script>
;(function(TEST){
TEST.ok = function(got, want, note){ if(got !== want){ throw Error(note + ': got ' + got + ', want ' + want) } };
TEST.run = async function(){
  var out, doc = view.contentDocument, page, forged = 0;
  document.body.dataset.open = 'safe'; localStorage.setItem('open.safe', 'safe');
  kit.ear('open.pwn', function(){ forged += 1 });
  if(doc){ doc.defaultView.kit.ear('open.pwn', function(){ doc.body.dataset.pwn = 'bad' }) }
  out = OPENCASE.wait;
  await kit.fetch(view, {html:attack.value});
  out = await out;
  TEST.ok(out.parent, 0, 'preview cannot read or change its parent DOM');
  TEST.ok(out.top, 0, 'preview cannot read or change its top DOM');
  TEST.ok(out.store, 0, 'preview has no origin storage');
  TEST.ok(out.frame, 0, 'preview cannot remove its sandbox');
  TEST.ok(out.pop, false, 'preview cannot open a popup');
  TEST.ok(out.net, 0, 'preview CSP blocks network requests');
  TEST.ok(out.rtc, 'undefined:undefined', 'preview cannot open a peer connection');
  TEST.ok(out.origin, 'null', 'preview receives an opaque origin');
  TEST.ok(out.ref, '', 'preview cannot read its parent URL as a referrer');
  TEST.ok(out.base, 'about:blank', 'preview cannot read its parent URL as a base');
  TEST.ok(forged, 0, 'preview cannot forge a Kit event');
  TEST.ok(doc ? doc.body.dataset.pwn : undefined, undefined, 'preview message is rejected by its direct parent');
  TEST.ok(document.body.dataset.open, 'safe', 'top DOM stayed unchanged');
  TEST.ok(localStorage.getItem('open.safe'), 'safe', 'top storage stayed unchanged');
  page = doc && doc.getElementById('page');
  if(page){
    TEST.ok(page.getAttribute('sandbox'), 'allow-scripts', 'only scripts are restored inside the sandbox');
    TEST.ok(page.getAttribute('referrerpolicy'), 'no-referrer', 'preview sends no referrer');
    TEST.ok(page.hasAttribute('src'), false, 'untrusted HTML never becomes a direct iframe URL');
  }
  result.textContent = 'PASS open isolates hostile HTML, storage, network, popups, and Kit messages';
};
addEventListener('load', function(){ TEST.run().catch(function(err){ result.textContent = 'FAIL\n' + (err.stack || err) }) });
}(window.TEST = {}));
</script>
