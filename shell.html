    <help></help>
    <raw></raw>
    <iframe></iframe>
    <style>

    </style>
  </task>
</shell>

<kit><tin>
  <belt><tray>
    <button>ls</button>
    <button>git</button>
    <button>npm</button>
    <button>kill</button>
  </tray></belt>
  <belt><tray>
    <button>claude</button>
    <button>codex</button>
    <button>gemini</button>
  </tray></belt>
  <belt><tray>
    <button>new</button>
  </tray></belt>
</tin></kit>

<button id="look">↓</button>

<fit>
</fit>

<style>
:root { --fill: var(--mood); --font: 'Courier New', monospace; }
body { display: flex; flex-direction: column; background: var(--fill); }
shell { flex: 1 0 auto; } /* keeps the sticky belt stack pinned low even when the session is short */
shell {
  width: 100%;
  font: var(--font);
  font-size: var(--cs);
  color: var(--pop);
}
task {
  margin: 1em 0;
}
symbol {
  display: inline;
  float: left;
  white-space: pre-wrap;
}
prompt {
  display: block;
  width: 100%;
  min-height: 1em;
  caret-shape: block;
  white-space: pre-wrap;
}
help {
  filter: hue-rotate(220deg) brightness(2);
  touch-action: manipulation;
}
fit { display: none; }
::selection { background: var(--pop); color: var(--fill); }
fit { display: none; }

iframe {
  height: 0;
  width: 1px;
  min-width: 100%; /* iOS sizes iframes to intrinsic content width — this pins layout to the container */
  max-hei-ght: calc(100dvh - 3em - 3em);
  transition: height 120ms ease;
}
iframe.shut {
  height: 0 !important;
}

</style>
<script src="util.js"></script>
<script>;(function(shell){
var root = shell.all('shell')[0];
var task = root.all('task')[0];
var model = task.cloneNode(1);
shell.seq = 0;
shell.apps = {};
shell.belt = {};
shell.fifo = [];
kit.ear('app', function(eve, d){ d = eve.detail || eve.data;
  (Array.isArray(d)? d : [d]).forEach(function(a, name){ if(!a){ return }
    name = a.name || a;
    if(shell.apps[name]){ return }
    shell.apps[name] = 1;
    shell.belt[name] = shell.belt[name] || (name + ' '); // tap prefills the prompt — bash is the composer
  });
});
kit.say(['codex','claude','gemini'], 'app'); // shell's own belt apps — cmd modules may register more
kit.ear('belt', function(eve, d, name, cmd, b){ d = eve.detail || eve.data;
  if(!d){ return }
  name = (Array.isArray(d)? d[0] : d.name || '' + d).trim();
  cmd = Array.isArray(d)? (d[1] || name) : (d.prompt || name);
  if(!name){ return }
  shell.belt[name] = cmd;
  if([...B.all('kit button')].some(function(v){ return v.textContent.trim() === name })){ return }
  b = B.new('kit button');
  b.textContent = name;
  B.all('kit tray')[0].append(b);
});
shell.ear('click', function(eve, b, cmd){
  if(!(b = eve.target.closest('kit button'))){ return }
  if('new' === b.textContent.trim()){ next(); shell.$.focus(); screen.buzz(); return } // a fresh prompt, nothing typed for you
  cmd = shell.belt[b.textContent.trim()] || (b.textContent.trim() + ' '); // unregistered names prefill, never blind-run
  if(/\s$/.test(cmd)){ kit.say(cmd, 'prompt.try'); return }
  kit.say(cmd, 'prompt');
  screen.buzz();
});
(shell.$ = task.all('prompt')[0]).focus();

kit.ear('chat',(eve, raw)=>{ raw = eve.detail || eve.data || eve;
  if('{'==raw[0]){ try{ if(shell.hook(JSON.parse(raw))){ return } }catch(e){}}
  shell.stream(raw);
});

shell.ear('keydown',function(eve){
  if(!eve.target.matches('prompt')){ return }
  shell.$ = eve.target;
  if('enter' == eve.key.toLowerCase() && !eve.shiftKey){
    eve.preventDefault();
    kit.say('', 'prompt');
    return;
  }
});
kit.ear('prompt',(eve, t, bin)=>{
  var cmd = eve.detail||eve.data;
  cmd = (cmd || shell.$.textContent || '').trim();
  shell.$.textContent = cmd;
  if(!cmd){ kit.say('\r','host'); screen.buzz(); return } // bare Enter just nudges the PTY, prompt stays live
  if(shell.mode){
    if('exit' === cmd || 'quit' === cmd){ shell.quit(); return }
    if('stop' === cmd){ shell.more('', 'stop'); shell.quit(); return }
    if(/^\$\s/.test(cmd)){ cmd = shell.$.textContent = cmd.replace(/^\$\s+/, '') } // escape hatch — one shell command, mode stays
    else { shell.more(cmd); return }
  }
  bin = (cmd.split(/\s+/)[0] || '').toLowerCase();
  if(shell.apps[bin] && !/\s/.test(cmd)){
    kit.say(cmd.toLowerCase() + ' ', 'prompt.try'); // bare tool name — stay in the prompt, wait for the ask
    return;
  }
  t = shell.$.up('task')[0];
  shell.$.removeAttribute('contenteditable');
  shell.used = 1;
  shell.fifo.push(t);
  if(shell.apps[bin]){
    t.job || (t.job = '' + (++shell.seq));
    shell.mode = {bin: bin, job: t.job}; // REPL — the prompt feeds this session until exit/stop
    shell.bash('$ ' + cmd + '\n');
    screen.buzz();
    next();
    return;
  }
  kit.say(cmd+'\r','host');
  screen.buzz();
  next();
});
kit.ear('quit',(eve, d)=>{ d = eve.detail || eve.data;
  if(shell.mode && shell.mode.job == d){ shell.quit() }
});
kit.ear('help',(eve, all, h)=>{
  all = root.all('help');
  if(!(h = all[all.length - 1])){ return }
  h.textContent = eve.detail || eve.data || '';
  h.cmd = ''; // status text is not tappable — clear any stale AI suggestion
  shell.note = h.textContent.trim()? 1 : 0; // while status shows, suggestions stay out of the help line
});
kit.ear('prompt.try',(eve, all, $, r, s)=>{
  var cmd = eve.detail || eve.data || '';
  if(!cmd){ return }
  next();
  all = root.all('prompt[contenteditable]');
  if(!($ = all[all.length - 1])){ return }
  $.textContent = cmd;
  (shell.$ = $).focus();
  r = document.createRange();
  r.selectNodeContents($);
  r.collapse(false); // caret at the end — typing continues the command, return runs it
  s = getSelection();
  s.removeAllRanges();
  s.addRange(r);
});
kit.ear('prompt.same',(eve)=>{
  var msg = eve.detail||eve.data||{};
  console.log('prompt.same:', msg);
  var cmd = (msg.run || msg.cmd || msg).trim();
  var t = (eve.target && eve.target.up) ? eve.target.up('task')[0] : null;
  if(!cmd || !t){ return }
  t.bin = (msg.bin || '').toLowerCase();
  t.cmd = msg.cmd || cmd;
  t.same = 1;
  shell.fifo.push(t);
  shell.used = 1;
  kit.say(cmd+'\r','host');
  screen.buzz();
});

shell.raw = '';
shell.stream = function(raw, clean, part, done, i, r, tail){
  (window.shellReply || {}).maybeContinue && window.shellReply.maybeContinue(raw, {state: shell, send: function(c){ kit.say(c, 'host') }});
  shell.raw += raw || '';
  if(shell.raw.length > 262144){ shell.raw = shell.raw.slice(-131072) } // a promptless firehose must not grow the buffer forever
  clean = (window.shellReply || {}).clean ? window.shellReply.clean(shell.raw) : shell.raw;
  part = (String.prototype.splitPrompts ? clean.splitPrompts() : String.prompts(clean));
  if(part.length > 1){
    done = part.slice(0, -1);
    shell.raw = part[part.length - 1];
    for(i = 0; i < done.length; i += 1){ shell.bash(done[i]) }
  }
  if(!shell.fifo[0] || !shell.fifo[0].all){ return }
  r = out(shell.fifo[0]);
  tail = ((window.shellReply || {}).clean ? window.shellReply.clean(shell.raw) : shell.raw).flat();
  if(r.tail && tail.length > r.tail.length && tail.slice(0, r.tail.length) === r.tail){
    r.append(document.createTextNode(tail.slice(r.tail.length))); // append-only growth — a selection mid-stream survives
  } else {
    text(r, tail);
  }
  r.tail = tail;
}
shell.head = function(raw, flat, line, hit, cmd){
  flat = (raw || '').flat();
  line = flat.split(/\r\n|\n|\r/)[0] || '';
  hit = line.match(/^(.*?)(\$|#|>|%|~%|PS>)\s*([\s\S]*)$/);
  cmd = hit ? hit[3].trim() : line.trim();
  return {
    path: hit ? hit[1].trim() : '',
    sign: hit ? hit[2].trim() : '$',
    line: line,
    cmd: cmd,
    bin: (cmd.split(/\s+/)[0] || '').trim().toLowerCase()
  };
}
shell.bash = function(raw, t, h, r, i, old, src, e){
  h = shell.head(raw);
  if(!h.cmd){ return }
  if((/^stty\b|^clear$|^export PS1=/.test(h.cmd) || /\$$/.test(h.cmd))
    && !(shell.fifo[0] && ((shell.fifo[0].all('prompt')[0]||'').textContent||'').trim() === h.cmd)){ return } // PTY init/echo noise (boot & reconnect) — never a task, never consumes the queue
  t = shell.fifo.shift();
  if(!t){
    if(!shell.used){ return } // PTY boot noise (stty/clear echoes) — no task bubbles before first user input
    t = fresh();
  }
  t.job || (t.job = '' + (++shell.seq));
  t.setAttribute('job', t.job);
  h.bin = t.bin || h.bin;
  h.cmd = t.cmd || h.cmd;
  t.bin = '';
  t.cmd = '';
  if(h.bin){ t.setAttribute('bin', h.bin) }
  text(t.all('symbol')[0], h.sign + ' ');
  text(t.all('prompt')[0], h.cmd);
  t.all('prompt')[0].removeAttribute('contenteditable');
  r = out(t);
  text(r, (raw || '').flat());
  if(!t.parentNode){
    e = root.lastElementChild;
    (e && e.all && e.all('prompt[contenteditable=true]')[0]) ? root.insertBefore(t, e) : root.append(t); // unsolicited output slots in above the live prompt, never after it
  }
  if(h.bin){
    old = t.all('iframe:not(.shut)')[0] || t.all('iframe')[0];
    i = old;
    src = './cmd/' + h.bin + '.html';
    if(old && old.getAttribute('src') && !t.same){
      i = old.cloneNode(0);
      i.removeAttribute('src'); // a cloned src starts loading the OLD page before the new one is assigned
      old.parentNode.insertBefore(i, old.nextSibling);
      old.classList.add('shut');
      setTimeout(function(){
        if(old.parentNode){ old.remove() }
      }, 140);
    }
    i.onload = function(){
      if(!i.readyState){ return i.remove() }
      i.classList.remove('shut');
      kit.say(shell.apps[h.bin] ? {$: h.cmd, raw: h.cmd, '#': t.job} : raw, h.bin, i); // entry is always a fresh session — panels hold their own sid, --resume overrides
      r.remove();
    };
    i.src = src;
  }
  t.same = 0;
  next();
}

shell.more = function(cmd, act, t, i){
  t = root.querySelector('task[job="' + shell.mode.job + '"]');
  i = t && (t.all('iframe:not(.shut)')[0] || t.all('iframe')[0]);
  if(!i){ shell.quit(); if(cmd){ kit.say(cmd, 'prompt') } return } // session panel gone — drop out and run it normally
  kit.say(act? {'#': shell.mode.job, act: act, more: 1} : {$: cmd, '#': shell.mode.job, more: 1}, shell.mode.bin, i);
  if(act){ return }
  shell.$.removeAttribute('contenteditable');
  shell.used = 1;
  next();
  screen.buzz();
}

shell.quit = function(t){
  if(!shell.mode){ return }
  shell.mode = 0; // next `claude` is a new task, a new job, a fresh session

  if(!(shell.$.textContent || '').trim()){
    t = shell.$.up('task')[0];
    text(t.all('symbol')[0], '$ '); // empty prompt just changes hands, no ghost bubble
    return;
  }
  shell.$.removeAttribute('contenteditable');
  next();
}

shell.hook = function(obj, t, i){
  if(!obj || !obj['#']){ return 0 }
  t = root.querySelector('task[job="' + String(obj['#']).replace(/"/g, '') + '"]');
  if(!t){ return obj.type? 1 : 0 } // typed reply for a dead task: drop, don't leak JSON into the stream
  i = t.all('iframe:not(.shut)')[0] || t.all('iframe')[0];
  if(!i){ return obj.type? 1 : 0 }
  kit.say(obj, obj.type || t.getAttribute('bin') || 'chat', i);
  return 1;
}

function text(v, s){
  v.textContent = s || '';
  if(!s){ v.append(document.createElement('br')) }
  return v;
}

function out(t, r, i){
  r = t.all('raw')[0];
  if(r){ return r }
  r = model.all('raw')[0].cloneNode(1);
  i = t.all('iframe:not(.shut)')[0] || t.all('iframe')[0];
  if(i && i.parentNode){ i.parentNode.insertBefore(r, i) }
  else { t.append(r) }
  return r;
}

function fresh(t){
  t = model.cloneNode(1);
  t.job = '' + (++shell.seq);
  t.setAttribute('job', t.job);
  text(t.all('symbol')[0], '$ ');
  text(t.all('prompt')[0], '');
  t.all('prompt')[0].setAttribute('contenteditable', 'true');
  text(t.all('help')[0], ' ');
  t.all('help')[0].cmd = '';
  text(t.all('raw')[0], '');
  t.all('iframe')[0].removeAttribute('src');
  return t;
}

function next(t){
  if((root.lastElementChild || {}).all && root.lastElementChild.all('prompt[contenteditable=true]')[0]){ return }
  t = fresh();
  if(shell.mode){ text(t.all('symbol')[0], shell.mode.bin + '> ') }
  root.append(t);
  shell.$ = t.all('prompt')[0];
  shell.$.focus();
}

kit.ear('clear',(eve)=>{
  while(root.firstChild){ root.firstChild.remove() }
  shell.fifo = [];
  next();
});

look.onclick = function(){
  B.scrollTop = B.scrollHeight; // quirks mode — the body is the scroller
  scrollTo(0, B.scrollHeight);
};

}(window.shell = document.body));
</script>
<script src="cmd/aid.js"></script>
