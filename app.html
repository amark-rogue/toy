<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1.0, user-scalable=no">

<script>navigator?.serviceWorker.register?.('./sw.js')</script>
<link rel="stylesheet" href="./gun/kit/web.css"><script src="./gun/kit/web.js"></script>

<form id="sign" onsubmit="cop.sign(1)">
  <input id="host" name="host" placeholder="host:" class="fog sap lip">
  <input id="pass" name="pass" type="password" placeholder="pass:" class="fog sap lip">
  <button type="submit"></button>
</form>

<style>
:root { --fill: var(--mood); }
#sign { flex-shrink: 0; }
iframe { width: 100%; flex: 1; min-height: 0; height: 0 !important; border: none; display: block; }
input::placeholder { opacity: 1; }
</style>

<script src="util.js"></script>
<script>;(function(cop){

location.hash = '';
host.focus();
console.off=1;

cop.sign = async (go, url)=>{
  if(cop.ws && (1 === cop.ws.readyState || (!go && 0 === cop.ws.readyState))){ return } // open, or already dialing (unless the user forces a retry)
  if(cop.ws){ try{ cop.ws.onclose = 0; cop.ws.close() }catch(e){} cop.ws = 0 }
  url = host.value || localStorage.host || (/^http/.test(location.origin)? location.origin : ''); // the app's own server relays the socket — no host to type, no autofill to depend on
  if(url){ localStorage.host = host.value = url }
  try{ cop.ws = new WebSocket(url.replace(/^http/,'ws') || 'ws://localhost:8022');
  }catch(e){ cop.ws = 0; return }
  cop.ws.onopen = ()=>{ cop.wait = 1000; cop.ws.send(localStorage.pass = (pass.value || localStorage.pass || ''));
    while((cop.limbo||[]).length){ cop.ws.send(cop.limbo.shift()) }
    location.path = 'shell.html';
  };
  cop.ws.onmessage = (eve) => { kit.say(eve.data,'chat') };
  cop.ws.onerror = (err) => { console.error('ws err:', err) };
  cop.ws.onclose = (eve) => { cop.ws=0;
    if('cannot pass' === eve.reason){ localStorage.removeItem('pass'); location.reload(); return } // stale pass rejected — back to a clean login, no retry spin
    setTimeout(() => { cop.wait = Math.min(cop.wait * 2, 30000); cop.sign() }, cop.wait = cop.wait || 1000);
  };
};

host.value = localStorage.host || (/^http/.test(location.origin)? location.origin : '');
(pass.value = localStorage.pass||'') && cop.sign();

kit.ear('host',(eve,cmd,no)=>{
  if(no === (cmd = eve.detail||eve.data)){ return }
  var msg = (typeof cmd === 'string') ? cmd : JSON.stringify(cmd);
  if(!cop.ws){ (cop.limbo = cop.limbo||[]).push(msg); return }
  cop.ws.send(msg);
});

}(window.cop = {}));
</script>
