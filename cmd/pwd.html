<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>
<script src="../gun/kit/dom.js"></script>
<div class="box">
  <div class="bar">
    <span class="tag">pwd</span>
  </div>
  <div id="content" class="crumbs"></div>
</div>
<style>
body { display: block; min-height: 0; overflow: hidden; }
.crumbs { display: flex; flex-wrap: wrap; gap: 0.3em; padding: 0.5em 0.8em; font-family: 'Courier New', monospace; font-weight: 900; }
.crumb { display: inline-flex; align-items: center; font-size: 0.7em; letter-spacing: 0.2em; text-transform: uppercase; background: color-mix(in srgb, var(--pop) 10%, transparent); border: 1px dashed color-mix(in srgb, var(--pop) 50%, transparent); border-radius: 0.5em; padding: 0.25em 0.8em; color: var(--pop); cursor: pointer; }
.crumb:active { background: var(--pop); color: var(--mood, black); }
</style>
<script src="../util.js"></script>
<script>
PWD = {};
PWD.read = function(s, at, n, all, line){
  s = (s || '').flat();
  at = s.search(/\r\n|\n|\r/);
  if(0 <= at){ n = '\r\n' === s.slice(at, at + 2) ? 2 : 1; s = s.slice(at + n) }
  all = s.split(/\r\n|\n|\r/);
  while(all.length){
    line = all.pop();
    if(!line.trim() || String.hit(line)){ continue }
    return line.trim();
  }
  return '';
};

PWD.draw = function(path, view, parts, now){
  view = B.all('#content')[0];
  view.replaceChildren();
  if(!path){ view.textContent = 'UNKNOWN PATH'; return }
  parts = path.split('/').filter(Boolean);
  if('/' === path.charAt(0)){
    now = B.new('div'); now.className = 'crumb'; now.textContent = '/';
    now.onclick = function(){ kit.say('cd /', 'prompt.same') };
    view.appendChild(now);
  }
  now = '/' === path.charAt(0) ? '' : '.';
  parts.forEach(function(part, crumb, go){
    now += '/' + part;
    go = now;
    crumb = B.new('div'); crumb.className = 'crumb'; crumb.textContent = part;
    crumb.onclick = function(){ kit.say('cd ' + go, 'prompt.same') };
    view.appendChild(crumb);
  });
};

kit.ear('pwd', function hear(eve) { hear.off();
  PWD.draw(PWD.read(eve.detail || eve.data || ''));
});
</script>
