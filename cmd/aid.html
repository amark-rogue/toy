<link rel="stylesheet" href="../gun/kit/web.css">
<link rel="stylesheet" href="./aid/ui.css">
<script src="../gun/kit/web.js"></script><script src="../gun/kit/dom.js"></script>

<section class="aid">
  <header class="bar hide"><span class="title">aid</span><button class="stop" type="button">Stop</button></header>
  <div class="feed" role="log" aria-live="polite"></div>
</section>

<div class="model">
  <article class="card say"><div class="md"></div></article>
  <details class="card think"><summary>Thinking …</summary><div class="md"></div></details>
  <article class="card stat"><small></small></article>
  <details class="card tool"><summary><b></b><i></i></summary><pre></pre></details>
  <article class="card plan"><b>Plan</b><ol><li></li></ol></article>
  <article class="card ask"><b></b><pre></pre><form><input aria-label="Reply" autocomplete="off"><span class="picks"><button type="button"></button></span><button class="send" type="submit">Send</button></form></article>
  <details class="card diff"><summary>Changes</summary><pre></pre></details>
  <article class="card done"><small></small></article>
  <article class="card fail"><b>Error</b><pre></pre></article>
  <div class="mark">
    <p class="para"></p><h1 class="head1"></h1><h2 class="head2"></h2><h3 class="head3"></h3>
    <h4 class="head4"></h4><h5 class="head5"></h5><h6 class="head6"></h6>
    <blockquote class="quote"><div class="md"></div></blockquote>
    <ul class="list"><li></li></ul><ol class="count"><li></li></ol>
    <pre class="code"><code></code></pre><hr class="rule">
    <strong class="bold"></strong><em class="ital"></em><s class="del"></s><code class="span"></code>
    <a class="link" target="_blank" rel="noopener noreferrer"></a>
    <details class="fold"><summary></summary><div class="md"></div></details>
  </div>
</div>

<script src="./aid/card.js"></script>
<script src="./aid/mark.js"></script>
<script src="./aid/ui.js"></script>
<script src="./aid/host.js"></script>
<script>
kit.createServer(function(req, res){
  if(aid.host.take(req.body)){ res.send(document); return }
  if(aid.host.miss(req.body)){ res.send(document); aid.host.open(req.body); return }
  AID.host(req.body); res.send(document);
});
</script>
