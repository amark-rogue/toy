<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>
<div class="box">
  <div class="bar">
    <span class="tag">ping</span>
    <span name="host" class="val"></span>
  </div>
  <pre name="out" class="out"></pre>
</div>
<style>
body { display: block; min-height: 0; overflow: hidden; }
</style>
<script src="../util.js"></script>
<script>
kit.createServer(function(req, res){
  res.send(kit.bind(document, read(req.body)));
});
function read(raw, line, hit){
  raw = (raw || '').flat().trim().split('\n');
  line = raw[0] || '';
  hit = line.match(/ping\s+(?:-[a-zA-Z0-9]+\s+)*([^\s]+)/);
  return {host:hit ? hit[1] : '?', out:raw.slice(1).join('\n')};
}
</script>
