<link rel="stylesheet" href="../gun/kit/web.css" /><script src="../gun/kit/web.js"></script>

<div class="box">
    <div class="bar">
        <span class="tag">open</span>
        <input
            id="addr"
            class="val"
            value=""
            placeholder="file.html or localhost:PORT/path"
            spellcheck="false"
        />
        <button id="go" class="act">go</button>
        <button id="ref" class="act">↻</button>
    </div>
    <div id="view"></div>
</div>

<style>
    body {
        display: block;
        min-height: 0;
        overflow: hidden;
    }
    .box {
        width: 100%;
        height: 33em;
        display: block;
    }
    .bar {
        display: flex;
        align-items: center;
        gap: 0.4em;
        padding: 0.3em 0.6em;
        border-bottom: 1px solid var(--pop);
        width: 100%;
    }
    .tag {
        font-weight: 900;
        white-space: nowrap;
    }
    .val {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        font-size: 0.8em;
        padding: 0.2em;
    }
    .act {
        background: transparent;
        border: 1px solid var(--pop);
        color: var(--pop);
        border-radius: 0.3em;
        padding: 0.2em 0.5em;
        font-size: 0.8em;
        cursor: pointer;
        white-space: nowrap;
        min-width: auto;
    }
    .act:active {
        background: var(--pop);
        color: var(--mood);
    }
    #view {
        display: block;
        padding: 0;
        width: 100%;
        min-height: 4em;
    }
    #view iframe {
        width: 100%;
        min-height: min(70dvh, 42em);
        border: none;
        display: block;
        background: white;
    }
    .err {
        color: var(--err);
        padding: 0.6em;
        font-family: monospace;
        font-size: 0.85em;
        display: block;
        text-align: left;
    }
    .load {
        opacity: 0.5;
        padding: 0.6em;
        font-family: monospace;
        font-size: 0.85em;
        display: block;
        text-align: left;
    }
</style>

<script>
    (function () {
        var view = document.getElementById("view");
        var addr = document.getElementById("addr");
        var port, path, file;
        var id = Math.random().toString(36).slice(2, 8);

        var arg = function (raw) {
            if (typeof raw === "object" && raw) raw = raw.file || raw.cmd || raw.raw || "";
            raw = String(raw || "").replace(/\x1B(?:\[[0-?]*[ -\/]*[@-~]|\][^\x07]+\x07)/g, "");
            var lines = raw.split(/\r\n|\r|\n/);
            for (var i = 0; i < lines.length; i += 1) {
                var m = lines[i].match(/(?:^|[$#>%]\s*)open\s+(["']?)(.*?)\1\s*$/i);
                if (m && m[2]) return m[2].trim();
            }
            return "";
        };

        var load = function (url) {
            url = url || addr.value || "";
            var m = url.match(/^(?:(?:localhost|127\.0\.0\.1):)?(\d+)(\/.*)?$/);
            if (!m) {
                file = url;
                addr.value = file;
                wait("opening " + file + "...");
                kit.up({ id: id, file: file }, "fetch");
                return;
            }
            port = m[1];
            path = m[2] || "/";
            addr.value = "localhost:" + port + path;
            wait("fetching localhost:" + port + path + "...");

            kit.up({ id: id, port: port, path: path }, "fetch");
        };

        var wait = function (msg) {
            view.textContent = "";
            var tip = document.createElement("p");
            tip.className = "load";
            tip.textContent = msg;
            view.append(tip);
        };

        var show = function (msg) {
            view.textContent = "";
            var p = document.createElement("p");
            p.className = "err";
            p.textContent = msg;
            view.append(p);
            kit.say({}, "style");
        };

        var render = function (html) {
            view.textContent = "";
            if (!html || !html.trim()) {
                show("empty content");
                return;
            }
            // render in sandboxed iframe
            var f = document.createElement("iframe");
            f.sandbox = "allow-scripts allow-forms allow-modals allow-popups allow-same-origin";
            f.srcdoc = html;
            f.onload = function () {
                // resize to content
                try {
                    var h = f.contentDocument.documentElement.scrollHeight;
                    f.style.height = Math.max(h, 100) + "px";
                } catch (e) {}
                // intercept link clicks
                try {
                    f.contentDocument.addEventListener("click", function (eve) {
                        var a = eve.target.closest("a");
                        if (!a) return;
                        var href = a.getAttribute("href");
                        if (!href || href.startsWith("http")) return;
                        eve.preventDefault();
                        if (href.startsWith("/")) path = href;
                        else path = path.replace(/[^\/]*$/, "") + href;
                        addr.value = "localhost:" + port + path;
                        load();
                    });
                } catch (e) {}
                kit.say({}, "style");
            };
            view.append(f);
            kit.say({}, "style");
        };

        var frame = async function (url, fallback) {
            if (navigator.serviceWorker) {
                try {
                    var reg = await navigator.serviceWorker.register("../sw.js", { scope: "/", updateViaCache: "none" });
                    await reg.update();
                    await navigator.serviceWorker.ready;
                    if (!navigator.serviceWorker.controller) {
                        await new Promise(function (done) {
                            var stop = setTimeout(done, 3000);
                            navigator.serviceWorker.addEventListener("controllerchange", function () {
                                clearTimeout(stop);
                                done();
                            }, { once: true });
                        });
                    }
                    var get = await fetch(url, { cache: "no-store" });
                    if (!get.ok) {
                        if (fallback) {
                            render(fallback);
                            return;
                        }
                        var why = await get.text();
                        show("open: could not read file from OPFS (" + get.status + "): " + why);
                        return;
                    }
                } catch (err) {
                    if (fallback) {
                        render(fallback);
                        return;
                    }
                    show("open: " + (err.message || err));
                    return;
                }
            } else if (fallback) {
                render(fallback);
                return;
            }
            view.textContent = "";
            var f = document.createElement("iframe");
            f.sandbox = "allow-scripts allow-forms allow-modals allow-popups allow-same-origin";
            f.src = url;
            f.onload = function () { kit.say({}, "style"); };
            view.append(f);
            kit.say({}, "style");
        };

        // live responses from VM.srv.fetch
        var hear = function (d) {
            d = d || {};
            if (d.id && d.id !== id) return;
            if (d.port && d.path) {
                // initial command: set port and load
                port = d.port;
                path = d.path || "/";
                addr.value = "localhost:" + port + path;
                load();
                return;
            }
            if (typeof d === "string" || d.cmd || d.raw) {
                var name = arg(d);
                if (name) load(name);
                return;
            }
            if (d.url) {
                addr.value = d.file || file;
                frame(d.url, d.html);
                return;
            }
            if (d.html) {
                render(d.html);
                return;
            }
            if (d.err) {
                show(d.err);
            }
        };
        kit.ear("open", function (eve) { hear(eve.detail || eve.data) });
        kit.createServer(function(req){ hear((req.body || {}).$) });

        document.getElementById("go").onclick = function () {
            load();
        };
        document.getElementById("ref").onclick = function () {
            load();
        };
        addr.onkeydown = function (e) {
            if (e.key === "Enter") load();
        };
    })();
</script>
