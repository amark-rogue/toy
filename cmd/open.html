<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script><script src="../gun/kit/dom.js"></script>
<link rel="stylesheet" href="./open/view.css">

<div class="box" name="body">
  <div class="bar">
    <span class="tag">open</span>
    <input id="addr" name="addr" class="val" placeholder="file.html or localhost:PORT/path" spellcheck="false">
    <button id="go" class="act" type="button">go</button>
    <button id="ref" class="act" type="button">↻</button>
  </div>
  <div id="view">
    <p name="load" class="load" hidden></p>
    <p name="err" class="err" hidden></p>
    <iframe id="page" name="page" title="Isolated preview" sandbox="allow-scripts" referrerpolicy="no-referrer" allow="camera 'none'; clipboard-read 'none'; clipboard-write 'none'; geolocation 'none'; microphone 'none'; payment 'none'; serial 'none'; usb 'none'" hidden></iframe>
  </div>
</div>

<template id="safe">
  <base href="about:blank">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; worker-src 'none'; frame-src 'none'; child-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'; manifest-src 'none'">
  <script>['RTCPeerConnection','webkitRTCPeerConnection'].forEach(function(name){ try{ Object.defineProperty(self, name, {value:undefined}) }catch(err){ try{ self[name] = undefined }catch(no){} } });</script>
</template>

<script src="./open/view.js"></script>
