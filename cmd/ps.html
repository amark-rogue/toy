<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>
<script src="../gun/kit/dom.js"></script>
<div class="box">
  <div class="bar">
    <span class="tag">tasks</span>
  </div>
  <div id="out" class="out procs"></div>
</div>
<div id="rowTpl" class="proc model">
  <span name="pid" class="pid"></span>
  <span name="cmd" class="pname"></span>
  <button class="kill" type="button" onclick="PS.kill(this)">kill</button>
</div>
<style>
body { display: block; min-height: 0; overflow: hidden; }
.procs { display: flex; flex-direction: column; gap: 0; }
.proc { display: flex; align-items: center; gap: 0.5em; padding: 0.35em 0; border-bottom: 1px solid color-mix(in srgb, var(--pop) 15%, transparent); font-family: 'Courier New', monospace; }
.pid { font-weight: bold; width: 3.5em; flex-shrink: 0; font-size: 0.85em; opacity: 0.7; }
.pname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85em; }
.kill { flex-shrink: 0; border: 1px solid var(--err); color: var(--err); padding: 0.15em 0.5em; cursor: pointer; font-family: 'Courier New', monospace; font-size: 0.75em; border-radius: 0.5em; background: transparent; }
.kill:active { background: var(--err); color: var(--mood, black); }
</style>
<script src="../util.js"></script>
<script>
kit.createServer(function(req, res){
  PS.draw(PS.read(req.body));
  res.send(document);
});
var PS = {};
PS.read = function(raw, lines, list){
  lines = (raw || '').flat().trim().split('\n').slice(1);
  if(lines.length && lines[0].includes('PID')){ lines.shift() }
  list = [];
  lines.forEach(function(line, part, pid){
    line = line.trim(); if(!line){ return }
    part = line.split(/\s+/); pid = part[0];
    if(isNaN(parseInt(pid))){ pid = part[1] }
    list.push({pid:pid, cmd:part.slice(3).join(' ') || part.join(' ')});
  });
  return list;
};
PS.draw = function(list, out, tpl){
  out = B.all('#out')[0];
  tpl = B.all('#rowTpl')[0];
  out.replaceChildren();
  list.forEach(function(data, row){
    row = tpl.cloneNode(true);
    row.id = ''; row.tag('model', -1);
    out.pin(kit.bind(row, data));
  });
};
PS.kill = function(button, row){
  row = button.closest('.proc');
  kit.say('kill -9 '+row.all('[name="pid"]')[0].textContent, 'prompt.add.set');
};
</script>
