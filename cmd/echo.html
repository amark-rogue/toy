<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>
<pre name="out" class="out"></pre>
<script src="../util.js"></script>
<script>
;(function(ECHO){
kit.createServer(function(req, res){
  res.send(kit.bind(document, ECHO.read(req.body)));
});
ECHO.read = function(raw){
  var s = String(raw || '').flat().trim().split(/\r\n|\n|\r/);
  return {out:s.slice(1).join('\n').trim() || s[0].replace(/^echo\s+/,'') || ' '};
};
}(window.ECHO = {}));
</script>
