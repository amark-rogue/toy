<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script><script src="../gun/kit/dom.js"></script>

<kit id="menu"><tin><belt><tray>
  <!-- b name="name"></b -->
  <button value="cp">cp</button>
  <button value="rm">rm</button>
  <button value="chmod">chmod</button>
  <button name="file" hidden value="tail">tail</button>
  <button id="shut">×</button>
</tray></belt></tin></kit>

<style>
body { display: block; }
kit { display: block; visibility: hidden; position: relative; width: 100%; height: auto; overflow: hidden; pointer-events: none; }
kit.live { visibility: visible; pointer-events: auto; }
kit::before { display: none; }
</style>

<script>
;(function(pop){
kit.createServer(function(req, res){
  res.send(kit.bind(document, pop.show(req.body)));
});

var B = document.body;
pop.menu = B.all('#menu')[0];
pop.shut = B.all('#shut')[0];
pop.show = function(item){
  if(!item || !item.name){ pop.item = null; pop.menu.tag('live', -1); return {name:'', file:false} }
  pop.item = item; pop.menu.tag('live', 1);
  if(navigator.vibrate){ navigator.vibrate(32) }
  return {name:item.name, file:item.file ? {} : false};
};
pop.hide = function(){
  pop.item = null; pop.menu.tag('live', -1);
  kit.up('', 'ls.hide');
};
pop.quote = function(s){ return "'" + ('' + s).replace(/'/g, "'\\''") + "'" };
pop.run = function(eve, run, cmd, item, file){
  run = eve.target.closest('button') || {};
  run = run.value || (run.dataset || {}).run;
  if(!run || !pop.item){ return }
  item = pop.quote(pop.item.name); file = pop.item.file;
  if('cp' === run){ cmd = 'cp ' + (file ? '' : '-R ') + item + ' ' + pop.quote(pop.item.name + '.copy') + ' && ls .' }
  if('rm' === run){ cmd = 'rm -rf ' + item + ' && ls .' }
  if('chmod' === run){ cmd = 'chmod ' + (file ? '644 ' : '755 ') + item + ' && ls .' }
  if('tail' === run){ cmd = 'tail -n 20 ' + item }
  pop.hide(); kit.say(cmd, 'prompt');
};
pop.menu.ear('click', pop.run);
pop.shut.ear('click', pop.hide);
}(window.pop = {}));
</script>
