<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>

<kit id="menu"><tin><belt><tray>
  <b id="name"></b>
  <button data-run="cp">cp</button>
  <button data-run="rm">rm</button>
  <button data-run="chmod">chmod</button>
  <button id="tail" data-run="tail">tail</button>
  <button id="shut">×</button>
</tray></belt></tin></kit>

<style>
body { display: block; }
kit { display: block; visibility: hidden; position: relative; width: 100%; height: auto; overflow: hidden; pointer-events: none; }
kit.live { visibility: visible; pointer-events: auto; }
kit::before { display: none; }
</style>

<script>
;(function(pop){
pop.hide = function(){
  menu.classList.remove('live');
  kit.up('', 'ls.hide');
};

pop.show = function(eve, item){
  item = eve.detail || eve.data || item || '';
  if(!item){ return }
  pop.item = item;
  name.textContent = item.name;
  tail.hidden = !item.file;
  menu.classList.add('live');
  navigator?.vibrate?.(32);
};

pop.quote = function(s){ return "'" + ('' + s).replace(/'/g, "'\\''") + "'" };

pop.run = function(eve, run, cmd, item, file){
  run = (eve.target.closest('button') || '').dataset;
  run = (run || {}).run;
  if(!run || !pop.item){ return }
  item = pop.quote(pop.item.name);
  file = pop.item.file;
  if('cp' === run){ cmd = 'cp ' + (file ? '' : '-R ') + item + ' ' + pop.quote(pop.item.name + '.copy') + ' && ls .' }
  if('rm' === run){ cmd = 'rm ' + (file ? '' : '-r ') + item + ' && ls .' }
  if('chmod' === run){ cmd = 'chmod ' + (file ? '644 ' : '755 ') + item + ' && ls .' }
  if('tail' === run){ cmd = 'tail -n 20 ' + item }
  pop.hide();
  kit.say(cmd, 'prompt');
};

kit.ear('ls.pop', pop.show);
menu.addEventListener('click', pop.run);
shut.addEventListener('click', pop.hide);
}(window.pop = {}));
</script>
