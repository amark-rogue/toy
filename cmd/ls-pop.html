<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>

<menu id="menu" aria-label="File actions">
  <b id="name"></b>
  <nav>
    <button data-run="cp">cp</button>
    <button data-run="rm">rm</button>
    <button data-run="chmod">chmod</button>
    <button data-run="tail">tail</button>
    <button id="shut" aria-label="Close">×</button>
  </nav>
</menu>

<style>
html, body { min-height: 0; overflow: hidden; }
body { display: block; }
menu { display: none; margin: 0; padding: 0.2em; }
menu.live { display: flex; align-items: center; gap: 0.35em; overflow-x: auto; }
b { flex: 1 1 auto; min-width: 3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav { display: flex; gap: 0.25em; }
button {
  min-width: 3em;
  min-height: 3em;
  padding: 0.45em 0.65em;
  color: var(--pop);
  background: transparent;
  border: 1px solid var(--pop);
  border-radius: 0.6em;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}
button:active { color: var(--mood); background: var(--pop); transform: scale(0.92); }
#shut { min-width: 2.5em; }
</style>

<script>
;(function(pop){
pop.hide = function(){
  menu.classList.remove('live');
  kit.up({height:'0px'}, 'style');
};

pop.show = function(eve, item){
  item = eve.detail || eve.data || item || '';
  if(!item){ return }
  pop.item = item;
  name.textContent = item;
  menu.classList.add('live');
  //requestAnimationFrame(function(){ kit.up(kit.size(), 'style') });
  //try { navigator.vibrate && navigator.vibrate(18) } catch(e) {}
};

pop.quote = function(s){ return "'" + ('' + s).replace(/'/g, "'\\''") + "'" };

pop.run = function(eve, run, cmd){
  run = (eve.target.closest('button') || '').dataset;
  run = (run || {}).run;
  if(!run || !pop.item){ return }
  cmd = run + ' ' + pop.quote(pop.item);
  if('cp' === run){ cmd += ' ' }
  pop.hide();
  kit.say(cmd, 'tail' === run ? 'prompt' : 'prompt.try');
};

kit.ear('ls.pop', pop.show);
menu.addEventListener('click', pop.run);
shut.addEventListener('click', pop.hide);
}(window.pop = {}));
</script>
