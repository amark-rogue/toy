<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script><script src="../gun/kit/dom.js"></script>

<div id="app">
  <iframe id="view" name="view" title="Git result" hidden></iframe>
  <pre name="raw" hidden></pre>
</div>

<style>
#app, iframe { display: block; width: 100%; }
[hidden] { display: none !important; }
pre { white-space: pre-wrap; word-break: break-word; }
</style>

<script src="../util.js"></script>
<script src="./git/grace.js"></script>
<script src="./git/route.js"></script>
<script>
;(function(G){
var view = document.body.all('#view')[0];

G.draw = function(show, raw){
  return kit.bind(document, {view:show ? {} : false, raw:show ? false : raw});
};

G.show = function(raw, cmd, bin){
  raw = raw || ''; cmd = G.cmd(raw.flat().split(/\r\n|\n|\r/)[0] || '');
  bin = (cmd.split(/\s+/)[1] || '').toLowerCase();
  if(!/^[a-z][a-z0-9]*$/.test(bin)){ G.draw(0, raw); return }
  G.draw(0, false);
  kit.fetch('./git/' + bin + '.html', raw, view).then(function(){ G.draw(1) }, function(){ G.draw(0, raw) });
};

G.fail = G.try;
G.try = function(){ G.draw(0, false); G.fail() };
G.pass = G.route;
G.route = function(raw){
  if(raw && 'object' === typeof raw){ raw = raw.raw || raw.$ || raw.cmd || '' }
  return G.pass(raw);
};
(G.wait || []).splice(0).forEach(G.show);
}(window.GIT = window.GIT || {}));
</script>
