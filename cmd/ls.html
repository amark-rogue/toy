<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>

<div class="wade"><list id="list"><a id="up" class="as">../</a><a id="add" class="as">+</a></list></div>
<template id="item"><a></a></template>
<iframe id="pop" src="./ls-pop.html"></iframe>

<style>
body { display: block; overflow: hidden; }
#pop { display: block; visibility: hidden; pointer-events: none; width: 100%; position: fixed; top: 33%; }
#pop.live { visibility: visible; pointer-events: auto; }
list {
  display: block;
  width: 100%;
  max-height: 26em;
  padding: 0 0.2em;
  overflow-x: auto;
  overflow-y: hidden;
  column-width: 8em;
  column-gap: 0.01em;
  scroll-padding-left: 50%;
  scroll-padding-right: 50%;
  text-align: center;
}
list a {
  display: inline-block;
  min-width: 3em;
  max-width: 9em;
  margin: 0 0.1em 0.2em;
  padding: 0.7em 0.6em;
  overflow-wrap: anywhere;
  border: 1px solid var(--pop);
  border-radius: 0.6em;
  background: transparent;
  font-weight: bold;
  line-height: 0.9em;
  text-align: center;
  white-space: normal;
  word-break: break-all;
  cursor: pointer;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
list a:hover, list a:active, .as { background: var(--pop); color: var(--mood); transform: scale(0.9); }
.as:hover, .as:active { transform: scale(1); }
</style>
<script src="../gun/kit/dom.js"></script><script src="../util.js"></script>
<script>
var CMD = {};
kit.createServer(function(req, res){
  CMD.draw(CMD.read(req.body), CMD.view);
  res.send(document);
});

CMD.view = B.all('#list')[0];
CMD.item = B.all('#item')[0];
CMD.add = B.all('#add')[0];
CMD.menu = B.all('#pop')[0];
CMD.read = function(raw, cut, text, by, all){
  cut = String(raw || '').flat().cut('\n', ESC); CMD.base(cut[0]); text = cut[2];
  text = text.replaceAll('\r\n','\t').replaceAll('\r','\t').replaceAll('\n','\t').replaceAll(/\s{2,}/g,'\t');
  by = 0 <= text.indexOf('\t') ? '\t' : /\s+/;
  all = text.split(by).map(function(one){ return one.flat().trim() }).filter(Boolean);
  return all.sort(function(a, b){ return a.toLowerCase().localeCompare(b.toLowerCase()) });
};
CMD.draw = function(all, view, link){
  view.all('a:not(#up):not(#add)').forEach(function(one){ one.remove() });
  all.forEach(function(name){
    link = CMD.item.content.firstElementChild.cloneNode(true);
    link.where = name; link.file = name.includes('.') && '.' !== name && '..' !== name;
    link.textContent = name + (link.file ? '' : '/');
    CMD.add.pin(link, -1);
  });
  view.scrollLeft = (view.scrollWidth - view.clientWidth) / 2;
};
CMD.path = '~';
CMD.base = function(cmd, hit){
  hit = cmd.match(/\bcd\s+(.+?)\s+&&\s+ls\b/);
  if(hit){ CMD.path = hit[1].replace(/\\(.)/g, '$1') }
};
CMD.go = function(name, part, out, root){
  root = '/' === CMD.path.charAt(0) ? '/' : '~';
  part = CMD.path.replace(/^~\/?|^\//, '').concat('/', name).split('/'); out = [];
  part.forEach(function(one){
    if(!one || '.' === one){ return }
    if('..' === one){ out.pop(); return }
    out.push(one);
  });
  return root + (out.length ? ('/' === root ? '' : '/') + out.join('/') : '');
};
CMD.arg = function(path){ return path.replace(/[^\w@%+=:,./~-]/g, '\\$&') };
CMD.hide = function(){ CMD.menu.tag('live', -1) };
CMD.pop = function(link, view){
  view = CMD.menu; view.tag('live', 1);
  kit.fetch(view, {name:link.where, file:link.file}).catch(CMD.hide);
  if(navigator.vibrate){ navigator.vibrate(33) }
};
B.all('#up')[0].where = '..';
kit.ear('ls.hide', CMD.hide);

B.ear('click', function(eve, link, path, cmd){
  link = eve.target.closest('list a');
  if(!link || !link.where){ return }
  if(link.file){ kit.say('cat ' + CMD.arg(link.where), 'prompt.add'); return }
  path = CMD.go(link.where); cmd = 'cd ' + CMD.arg(path) + ' && ls .';
  localStorage.pwd = cmd; kit.say(cmd, 'prompt');
});
B.ear('contextmenu', function(eve, link){
  link = eve.target.closest('list a');
  if(!link || !link.where){ return }
  eve.preventDefault(); CMD.pop(link);
});
B.ear('touchstart', function(eve, link){
  link = eve.target.closest('list a');
  if(!link || !link.where){ return }
  clearTimeout(CMD.to); CMD.to = setTimeout(function(){ CMD.pop(link) }, 999/2);
});
B.ear('touchmove touchend touchcancel', function(){ clearTimeout(CMD.to) });

kit.say([['ls','ls .'],['git','git status'],['npm','npm '],['kill','kill '],['clear','clear']], 'belt');
kit.say([['claude','claude '],['codex','codex '],['grok','grok '],['agy','agy '],['opencode','opencode '],['aid','aid ']], 'belt');
</script>
