<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>

<div name="ok" class="box" hidden>
  <div class="bar"><span class="tag">mkdir</span><span name="file" class="val"></span></div>
</div>
<div name="bad" class="box err" hidden>
  <div class="bar"><span class="tag">error</span><span name="text" class="val"></span></div>
</div>

<style>
body { display: block; min-height: 0; overflow: hidden; }
.err .tag, .err .val { color: var(--err); }
</style>
<script src="../util.js"></script>
<script>
;(function(MK){
kit.createServer(function(req, res){
  res.send(kit.bind(document, MK.read(req.body)));
});

MK.read = function(raw, line, out, name){
  line = String(raw || '').flat().trim().split(/\r\n|\n|\r/);
  out = line.slice(1).join('\n').trim();
  name = (line[0] || '').replace(/^.*?mkdir\s+(?:-p\s+)?/,'').trim();
  if(out && /exist|denied/i.test(out)){ return {ok:false, bad:{text:out.slice(0, 40)}} }
  return {ok:{file:name}, bad:false};
};
}(window.MK = {}));
</script>
