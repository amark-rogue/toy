<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>
<div class="box">
  <div class="bar">
    <span class="tag">npm</span>
    <span name="sub" class="val"></span>
  </div>
  <pre name="out" class="out"></pre>
  <div class="acts">
    <button onclick="kit.say('npm install','prompt')">install</button>
    <button onclick="kit.say('npm start','prompt')">start</button>
    <button onclick="kit.say('npm test','prompt')">test</button>
    <button onclick="kit.say('npm run build','prompt')">build</button>
  </div>
</div>
<style>
body { display: block; min-height: 0; overflow: hidden; }
.acts { display: flex; flex-wrap: wrap; gap: 0.4em; padding: 0.5em 0.8em; border-top: 1px solid color-mix(in srgb, var(--pop) 30%, transparent); flex-shrink: 0; }
.acts button { flex: 1 1 40%; min-width: 0; font-family: 'Courier New', monospace; font-weight: bold; font-size: 0.85em; border: 1px solid var(--pop); padding: 0.4em; border-radius: 0.5em; background: transparent; color: inherit; cursor: pointer; }
.acts button:active { background: var(--pop); color: var(--mood); }
.out { display: block; padding: 0.6em 0.8em; font-family: 'Courier New', monospace; font-size: 0.85em; white-space: pre-wrap; word-break: break-word; text-align: left; }
</style>
<script src="../util.js"></script>
<script>
kit.createServer(function(req, res) {
  res.send(kit.bind(document, read(req.body)));
});
function read(raw){
  raw = (raw || '').flat().trim();
  var s = raw.split('\n').map(function(l) {
    var parts = l.split('\r');
    for(var i = parts.length - 1; i >= 0; i--) {
      var clean = parts[i].replace(/[^\x09\x20-\x7E]/g, '').trim();
      if(clean) return clean;
    }
    return '';
  }).filter(function(l){ return l; });
  var head = (s[0] || '').replace(/^.*?[$#>%]\s*/, '').replace(/^npm\s+/, '');
  return {sub:head.split(/\s+/)[0] || '?', out:s.slice(1).join('\n')};
}
</script>
