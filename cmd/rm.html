<link rel="stylesheet" href="../gun/kit/web.css"><script src="../gun/kit/web.js"></script>

<span name="err" class="err" hidden></span>
<div name="fix" class="fix" hidden>
  <div class="ls"><button type="button" onclick="kit.say(this.textContent, 'prompt')"><span name="cmd"></span></button></div>
</div>

<style>
.err { color: var(--err); }
.fix { padding: 10px; }
.ls {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4em;
  align-content: flex-start;
}
.ls button {
  display: block;
  flex: 0 0 auto;
  min-width: 4em;
  padding: 0.7em 1.2em;
  text-align: center;
  background: color-mix(in srgb, var(--pop) 8%, transparent);
  border: 1px solid var(--pop);
  border-radius: 0.6em;
  font-family: 'Courier New', monospace;
  font-weight: 900;
  cursor: pointer;
  user-select: none;
  color: var(--pop);
}
.ls button:active {
  background: var(--pop);
  color: var(--mood);
  transform: scale(0.92);
}
.ls button { border-color: var(--yes); color: var(--yes); }
</style>

<script src="../util.js"></script>
<script>
kit.createServer(function(req, res){
  res.send(kit.bind(document, RM.read(req.body)));
});
var RM = {};
RM.read = function(raw, lines, cmd, out, name, low){
  raw = (raw || '').flat();
  lines = raw.trim().split('\n'); cmd = lines[0] || '';
  out = lines.slice(1).join('\n').trim();
  name = cmd.split(' ').slice(-1)[0] || '';
  if(/^["']/.test(name)){ name = name.slice(1, -1) }
  if(!out){ return {err:false, fix:false} }
  low = out.toLowerCase();
  if(low.includes('is a directory')){
    return {err:'Failed to delete. Try:', fix:{cmd:'rm -rf ' + RM.arg(name)}};
  }
  if(low.includes('no such file')){ return {err:'no such file', fix:false} }
  if(low.includes('permission denied')){
    return {err:'Permission denied. Try:', fix:{cmd:'sudo rm ' + RM.arg(name)}};
  }
  return {err:'Error: ' + out, fix:false};
};
RM.arg = function(val, safe){
  safe = String(val).replace(/(["\\$`])/g, '\\$1');
  if(val === safe && !/\s/.test(val)){ return val }
  return '"' + String(val).replace(/(["\\$`])/g, '\\$1') + '"';
};
</script>
